<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maison Yass - Admin</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ===== VARIABLES ===== */
        :root {
            --primary: #cc0000;
            --primary-dark: #990000;
            --secondary: #1a1a1a;
            --white: #ffffff;
            --background: #f8f8f8;
            --text-light: #999;
            --text-dark: #333;
            --accent-gold: #b68d4c;
            --border-hairline: #ddd;
            --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: var(--background);
            min-height: 100vh;
        }

        /* ===== ÉCRAN DE CONNEXION ADMIN — habillage plein écran ===== */
        .admin-page-bg {
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(160deg, rgba(20, 15, 13, 0.88) 0%, rgba(28, 22, 19, 0.78) 45%, rgba(138, 31, 59, 0.55) 100%),
                url('../img/banniere-accueil.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .admin-page-bg::after {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(ellipse at center, transparent 30%, rgba(12, 9, 8, 0.55) 100%);
        }

        .slides-container { 
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center;
            padding: 2rem;
        }

        .admin-login-container {
            width: 100%;
            max-width: 430px;
            margin: 0 auto;
            padding: 3rem 2.5rem 2.5rem;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            border-radius: 6px;
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(182, 141, 76, 0.4);
            position: relative;
        }
        .admin-login-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 64px;
            height: 3px;
            background: var(--accent-gold);
        }
        .admin-login-container .logo-admin {
            text-align: center;
            margin-bottom: 2.2rem;
        }
        .admin-login-container .logo-admin .icon-circle {
            width: 68px;
            height: 68px;
            margin: 0 auto 1rem;
            border-radius: 50%;
            background: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 24px rgba(28, 22, 19, 0.3);
        }
        .admin-login-container .logo-admin i {
            font-size: 1.7rem;
            color: var(--accent-gold);
        }
        .admin-login-container .logo-admin h1 {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            letter-spacing: 0.5px;
            color: var(--secondary);
            margin-top: 0.2rem;
        }
        .admin-login-container .logo-admin p {
            color: var(--text-light);
            font-size: 0.82rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: 0.3rem;
        }
        .admin-login-container .form-group {
            margin-bottom: 1.4rem;
        }
        .admin-login-container .form-group label {
            display: block;
            font-weight: 500;
            font-size: 0.82rem;
            letter-spacing: 0.3px;
            margin-bottom: 0.4rem;
            color: var(--secondary);
        }
        .admin-login-container .form-group label i {
            color: var(--accent-gold);
            margin-right: 4px;
            width: 14px;
        }
        .admin-login-container .form-group input {
            width: 100%;
            padding: 13px 16px;
            border: 1px solid var(--border-hairline);
            border-radius: 4px;
            font-family: 'Poppins', sans-serif;
            font-size: 0.95rem;
            background: var(--white);
            transition: var(--transition);
        }
        .admin-login-container .form-group input:focus {
            outline: none;
            border-color: var(--accent-gold);
            box-shadow: 0 0 0 3px rgba(182, 141, 76, 0.18);
        }
        .admin-login-container .form-group input::placeholder {
            color: #bbb;
        }

        /* ===== RESTER CONNECTÉ ===== */
        .remember-me {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 1.5rem;
            cursor: pointer;
        }
        .remember-me input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }
        .remember-me label {
            font-size: 0.85rem;
            color: var(--text-dark);
            cursor: pointer;
            font-weight: 500;
        }
        .remember-me label i {
            color: var(--accent-gold);
            margin-right: 6px;
        }

        .admin-login-container .btn-primary {
            width: 100%;
            padding: 14px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            background: var(--secondary);
            color: var(--white);
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: var(--transition);
        }
        .admin-login-container .btn-primary:hover {
            background: var(--primary);
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(138, 31, 59, 0.3);
        }
        .admin-login-container .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }
        .admin-login-container .error-msg {
            background: rgba(138, 31, 59, 0.08);
            color: var(--primary-dark);
            padding: 11px 16px;
            border-radius: 4px;
            margin-bottom: 1.2rem;
            display: none;
            font-size: 0.85rem;
            border-left: 3px solid var(--primary);
        }
        .admin-login-container .back-link {
            display: block;
            text-align: center;
            margin-top: 1.6rem;
            font-size: 0.85rem;
            color: var(--text-light);
            transition: var(--transition);
            text-decoration: none;
        }
        .admin-login-container .back-link:hover {
            color: var(--primary);
        }

        /* ===== SPINNER ===== */
        .spinner {
            display: inline-block;
            animation: spin 0.8s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @media (max-width: 768px) {
            .admin-login-container {
                margin: 0 1.2rem;
                padding: 2.2rem 1.6rem 2rem;
            }
        }
    </style>
</head>
<body>
    <!-- FOND PLEIN ÉCRAN -->
    <div class="admin-page-bg"></div>

    <!-- CONTENU -->
    <div class="slides-container">
        <div class="admin-login-container">
            <div class="logo-admin">
                <div class="icon-circle">
                    <i class="fas fa-user-shield"></i>
                </div>
                <h1>Administration</h1>
                <p>Maison Yass — Parfumerie</p>
            </div>
            <div id="error-msg" class="error-msg">
                <i class="fas fa-exclamation-circle"></i> Identifiants incorrects
            </div>
            <form id="login-form">
                <div class="form-group">
                    <label><i class="fas fa-user"></i> Nom d'utilisateur</label>
                    <input type="text" id="username" placeholder="Maisonyassadmin" required autocomplete="off">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-lock"></i> Mot de passe</label>
                    <input type="password" id="password" placeholder="84235976120" required autocomplete="off">
                </div>

                <!-- RESTER CONNECTÉ -->
                <div class="remember-me">
                    <input type="checkbox" id="remember-checkbox">
                    <label for="remember-checkbox">
                        <i class="fas fa-check-circle"></i> Rester connecté
                    </label>
                </div>

                <button type="submit" class="btn-primary" id="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Se connecter
                </button>
            </form>
            <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Retour à la boutique</a>
        </div>
    </div>

    <script>
        const API_URL = 'https://maison-yass.onrender.com/';

        // ===== VÉRIFICATION DE LA SESSION =====
        function verifierSession() {
            const token = localStorage.getItem('admin_token');
            if (!token) return false;

            fetch(`${API_URL}/api/admin/verify`, {
                headers: { 'Authorization': `Bearer ${token}` }
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    localStorage.removeItem('admin_token');
                }
            })
            .catch(() => {
                localStorage.removeItem('admin_token');
            });
        }

        // ===== GESTION DU FORMULAIRE =====
        document.getElementById('login-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const rememberMe = document.getElementById('remember-checkbox').checked;
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');

            // Réinitialiser le message d'erreur
            errorMsg.style.display = 'none';

            // Validation des champs
            if (!username || !password) {
                errorMsg.textContent = '❌ Veuillez remplir tous les champs';
                errorMsg.style.display = 'block';
                return;
            }

            // Désactiver le bouton pendant la requête
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="spinner"><i class="fas fa-circle-notch"></i></span> Connexion...';

            try {
                const response = await fetch(`${API_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await response.json();

                if (data.success && data.token) {
                    // Sauvegarder le token
                    localStorage.setItem('admin_token', data.token);
                    localStorage.setItem('admin_username', data.username || username);
                    
                    // Si "Rester connecté" est coché, on garde une marqueur
                    if (rememberMe) {
                        localStorage.setItem('remember_me', 'true');
                    } else {
                        localStorage.removeItem('remember_me');
                    }

                    // Rediriger vers le dashboard
                    window.location.href = 'admin-dashboard.html';
                } else {
                    // Afficher l'erreur
                    errorMsg.textContent = '❌ Identifiants incorrects';
                    errorMsg.style.display = 'block';
                    
                    // Vider les champs pour forcer l'utilisateur à ressaisir
                    document.getElementById('password').value = '';
                    document.getElementById('password').focus();
                }
            } catch (error) {
                console.error('Erreur de connexion:', error);
                errorMsg.textContent = '❌ Erreur de connexion au serveur. Vérifiez que le serveur est démarré.';
                errorMsg.style.display = 'block';
            } finally {
                // Réactiver le bouton
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i class="fas fa-sign-in-alt"></i> Se connecter';
            }
        });

        // ===== TOUCHE ENTRÉE =====
        document.getElementById('username').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });
        document.getElementById('password').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                document.getElementById('login-form').dispatchEvent(new Event('submit'));
            }
        });

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', function() {
            // Vérifier si déjà connecté
            verifierSession();
        });
    </script>
</body>
</html>
